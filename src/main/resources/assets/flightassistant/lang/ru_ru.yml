modmenu:
  descriptionTranslation:
    flightassistant: FlightAssistant предлагает вам ощутить полеты с Элитрами по-новому, и все на стороне клиента!

alert.flightassistant:
  alert:
    .: ПРЕДУПР
    fault: ОТКАЗ (НЕКОТОРЫЕ ПРЕДУПР ПОТЕР)
  autoflight:
    .: АВТО ПОЛЕТ
    fault: ОТКАЗ СИСТ
    heading_fault: ОТКАЗ УПР КУРСОМ
    pitch_fault: ОТКАЗ УПР УГЛ НАКЛ
    roll_fault: ОТКАЗ УПР КРЕНОМ
    autopilot_off:
      .: АП ОТКЛ
      push_to_silence: ' -КЛАВИША ОТКЛ АП: НАЖАТЬ ДЛЯ ЗАГЛУШ'
    auto_thrust_off: А/ТЯГА ОТКЛ
  elytra:
    .: ЭЛИТРЫ
    fault: ОТКАЗ СТАТУС
    low_durability: НИЗК ПРОЧНОСТЬ
    critical_durability: КРИТ ПРОЧНОСТЬ
  fault:
    computer:
      reset: ' -СИСТЕМА: ВЫКЛ ЗАТЕМ ВКЛ'
    hud:
      .: HUD
      data: ОТКАЗ ДАНН ИНД
      reset: ' -ИНДИК: ВЫКЛ ЗАТЕМ ВКЛ'
      flightassistant:altitude: ОТКАЗ ИНД ВЫС
      flightassistant:attitude: ОТКАЗ ИНД ОРИЕНТ
      flightassistant:automation_modes: ОТКАЗ ИНД АВТО РЕЖИМ
      flightassistant:coordinates: ОТКАЗ ИНД КООРД
      flightassistant:course_deviation: ОТКАЗ ИНД ОТКЛ КУРС
      flightassistant:elytra_durability: ОТКАЗ ИНД ПРЧН/ЭЛ
      flightassistant:flight_directors: ОТКАЗ ИНД УКАЗ/П
      flightassistant:flight_path: ОТКАЗ ИНД ВЕКТ/П
      flightassistant:heading: ОТКАЗ ИНД КУРСА
      flightassistant:radar_altitude: ОТКАЗ ИНД Р/ВЫС
      flightassistant:speed: ОТКАЗ ИНД СКОР
      flightassistant:status: ОТКАЗ ИНД СТАТУС
  firework:
    .: ФРВК
    fault: ОТКАЗ СИСТ
    explosive:
      main_hand: ОСН РУКА ВЗРЫВООПАСН
      off_hand: ВТОР РУКА ВЗРЫВООПАСН
    slow_response: МЕДЛЕН ОТКЛИК
    no_response: ОТСУТСТВ ОТКЛИК
  flight_controls:
    .: УПР/ПОЛЕТ
    pitch_fault:
      .: ОТКАЗ ОГРАН УГЛА НАКЛ
      use_automation_override: ' -ПРИНУД ОТКЛ АВТОМАТ: ИСПОЛЬЗ'
    protections_lost:
      .: ЗАЩИТЫ ПОТЕРЯНЫ
      enable_air_data: ' -КОМП ДАННЫХ ПОЛЕТА: ВЫКЛ ЗАТЕМ ВКЛ'
      enable_ground_proximity: ' -КОМП БЛИЗ ЗЕМЛ: ВЫКЛ ЗАТЕМ ВКЛ'
      enable_pitch: ' -КОМП УГЛА НАКЛ: ВЫКЛ ЗАТЕМ ВКЛ'
      enable_prot_sys: ' -КОМП ЗАЩИТ: ВЫКЛ ЗАТЕМ ВКЛ'
      max_pitch: ' МАКС УГОЛ НАКЛ: 45* ВВЕРХ'
      min_pitch: ' МИН УГОЛ НАКЛ: 35* ВНИЗ'
      maneuver_with_care: ' МАНЕВРИРУЙ С ОСТОРОЖНОСТЬЮ'
  flight_plan:
    .: ПЛАН/П
    fault: ОТКАЗ СИСТ
    departure_elevation_disagree: НЕСОГЛ ВЫС ВЫЛЕТА
    arrival_elevation_disagree:
      .: НЕСОГЛ ВЫС ПРИБЫТИЯ
      glide_slope_unreliable: ' ГЛИССАДА НЕНАДЕЖН'
      autopilot_do_not_use: ' -АВТОПИЛОТ: НЕ ИСПОЛЬЗ'
    obstacles_on_path: ПРЕПЯТСТВИЯ НА ПУТИ
    descent_too_steep: СПУСК СЛИШКОМ КРУТОЙ
  gpws:
    .: GPWS
    fault: ОТКАЗ
    dont_sink: НЕ ПАДАЙ
    sink_rate: СКОР. СНИЖЕНИЯ
    terrain_ahead: ЗЕМЛЯ ВПЕРЕДИ
    below_glide_slope: НИЖЕ ГЛИССАДЫ
    pull_up: ТЯНИ ВВЕРХ
  navigation:
    .: НАВИГАЦ
    air_data_fault: ОТКАЗ ДАНН ПОЛЕТ
    chunk_status_fault: ОТКАЗ СТАТУС ЧАНКОВ
    void_proximity_fault: ОТКАЗ БЛИЗ ПУСТ
    slow_chunk_loading: МЕДЛЕН ЗАГРУЗКА ЧАНКОВ
    no_chunks_loaded: ЧАНКИ НЕ ЗАГРУЖЕНЫ
    approaching_void_damage_altitude: ПРИБЛИЖ ОПАСН ВЫС ПУСТОТЫ
    reached_void_damage_altitude: ДОСТИГ ОПАСН ВЫС ПУСТОТЫ
  stall:
    .: СВАЛИВАНИЕ
    detection_fault: ОТКАЗ ОБНАРУЖ
  thrust:
    .: ТЯГА
    fault: ОТКАЗ СИСТ
    no_source: ОТСУТ ИСТОЧ
    locked:
      .: БЛОК
      use_keys: ' -КЛАВИШИ УПР ТЯГИ: ИСПОЛЬЗ'
    reverse_not_supported:
      .: ОБРАТН НЕ ПОДДЕРЖ
      set_forward: ' -ТЯГА: УСТАН ВПЕРЕД'

config.flightassistant:
  general:
    .: Основное
    mod_enabled:
      .: Включить FlightAssistant
      description: Включает или выключает мод целиком
    show_hud:
      .: Показывать HUD
      description: Управляет видимостью HUD
    alerts:
      .: Предупреждения безопасности полёта
      description: Управляет тем, включены ли предупреждения и как они до вас доносятся. Предупреждения не будут отображаться на HUD, если §lПоказывать HUD§r выключено
      enabled_hud_sound: 'Включено: HUD и звук'
      enabled_hud_only: 'Включено: только HUD'
      enabled_sound_only: 'Включено: только звук'
      disabled: Выключено
    allow_automations:
      .: Разрешить автоматическое управление игроком
      description: Управляет тем, может ли мод брать управление игроком на себя. Требуется для включения защит полёта и использования некоторых функций, таких как автопилот. §lСерверы могут считать это нечестным преимуществом.
    allow_automations_in_gui:
      .: Разрешить автоматизацию в интерфейсах
      description: Управляет тем, может ли мод управлять игроком, пока открыт интерфейс (например, инвентарь или экран паузы)
    flight_protections:
      .: Включить защиты полёта
      description: Управляет тем, могут ли защиты полёта активироваться. Отдельные защиты можно настроить во вкладке §lЗащиты полёта§r
    autopilot_resistance_threshold:
      .: Порог сопротивления автопилота
      description: Управляет тем, насколько сильно нужно двигать мышь, чтобы принудительно отключить автопилот
  hud:
    .: HUD
    frame:
      .: Рамка
      width:
        .: Ширина рамки
        description: Управляет шириной рамки HUD в процентах от ширины окна игры
      height:
        .: Высота рамки
        description: Управляет высотой рамки HUD в процентах от высоты окна игры
      allow_drawing_outside_frame:
        .: Разрешить отрисовку за рамкой
        description: Управляет тем, могут ли некоторые элементы, такие как шкала угла наклона авиагоризонта, отрисовываться за пределами рамки
    colors:
      .: Цвета
      main:
        .: Основной цвет рамки
        description: Управляет цветом большинства элементов HUD, таких как показания, шкалы и линия горизонта
      secondary:
        .: Дополнительный цвет рамки
        description: Управляет цветом менее важных элементов HUD, таких как статусные сообщения и отметки шкал
      advisory:
        primary:
          .: Основной цвет указаний
          description: Управляет цветом, используемым для указаний автоматики, таких как указатели полёта, цели автоматики и активированные режимы автоматики
        secondary:
          .: Дополнительный цвет указаний
          description: Управляет цветом, используемым для второстепенных указаний автоматики, таких как индикатор отклонения от курса
      warning:
        .: Цвет предупреждения
        description: Управляет цветом, используемым для потенциальных опасностей, требующих вашего внимания, таких как низкая прочность элитр
      danger:
        .: Цвет опасности
        description: Управляет цветом, используемым для критических опасностей, требующих немедленных действий, таких как сваливание или неминуемая катастрофа
    display:
      always: Всегда
      when_elytra_equipped: Когда элитры надеты
      when_flying: Во время полёта
      never: Никогда
    attitude:
      .: Авиагоризонт
      show:
        .: Показывать авиагоризонт
        description: Управляет тем, когда отображается авиагоризонт. Как и большинство элементов этой вкладки, он может отображаться всегда, когда надеты элитры, во время полёта или никогда. Он отображает линию горизонта, которая наклоняется и движется с вашим углом наклона и креном, помогая вам оставаться ориентированным
      elements:
        .: Элементы
        description: Управляет тем, из каких элементов состоит авиагоризонт. Шкала угла наклона — это набор пунктирных линий, показывающих, насколько круто вы набираете высоту или снижаетесь, в градусах
        horizon_and_ladder: Горизонт и шкала угла наклона
        horizon_only: Только горизонт
      ladder_degree_interval:
        .: Интервал шкалы угла наклона
        description: Управляет тем, насколько далеко друг от друга расположены линии шкалы угла наклона, в градусах. Меньшие значения более детальны, но также более загромождают экран
    speed:
      .: Скорость
      show_reading:
        .: Показывать показания
        description: Управляет тем, когда отображаются показания скорости. Они показывают, насколько быстро вы движетесь в направлении взгляда, в блоках в секунду
      show_scale:
        .: Показывать шкалу
        description: Управляет тем, когда отображается шкала скорости. Это движущаяся вертикальная лента рядом с показаниями скорости, которая помогает замечать изменения скорости
      show_ground_speed:
        .: Показывать путевую скорость
        description: Управляет тем, когда отображаются показания путевой скорости. Они показывают вашу полную горизонтальную скорость, включая снос в направлениях, отличных от направления взгляда
      show_vertical_speed:
        .: Показывать вертикальную скорость
        description: Управляет тем, когда отображаются показания вертикальной скорости. Они показывают, насколько быстро вы набираете высоту или снижаетесь, в блоках в секунду
    altitude:
      .: Высота
      show_reading:
        .: Показывать показания
        description: Управляет тем, когда отображаются показания высоты. Они показывают вашу текущую высоту (координату Y) в мире
      show_scale:
        .: Показывать шкалу
        description: Управляет тем, когда отображается шкала высоты. Это движущаяся вертикальная лента рядом с показаниями высоты, которая помогает замечать изменения высоты
      show_height_above_ground:
        .: Показывать высоту над землёй
        description: Управляет тем, когда отображаются показания высоты над землёй. Они показывают расстояние до поверхности под вами, что полезно при посадке. Если под вами нет поверхности, они показывают расстояние до высоты урона от пустоты
    heading:
      .: Курс
      show_reading:
        .: Показывать показания
        description: Управляет тем, когда отображаются показания курса. Они показывают направление вашего взгляда как пеленг компаса от 0° до 360°
      show_scale:
        .: Показывать шкалу
        description: Управляет тем, когда отображается шкала курса. Это горизонтальная лента с отметками компаса вокруг показаний курса
    elytra_durability:
      .: Прочность элитр
      show:
        .: Показывать прочность элитр
        description: Управляет тем, когда отображается индикатор прочности элитр. Он показывает, сколько времени полёта осталось у ваших элитр, и меняет цвет по мере износа
      units:
        .: Единицы прочности
        description: Управляет тем, как отображается прочность элитр. Время (приблизительное) оценивает, сколько времени полёта осталось, на основе текущей прочности и зачарований
        raw: Minecraft
        percentage: Проценты
        time: Время (приблизительное)
    automation:
      .: Автоматизация
      show_automation_modes:
        .: Показывать режимы автоматизации
        description: Управляет тем, когда отображается индикатор режимов автоматизации. Это ряд панелей вдоль верхнего края HUD, показывающий, что делает каждая часть автоматики, например активные режимы автопилота
      show_flight_directors:
        .: Показывать указатели полёта
        description: Управляет тем, когда отображаются указатели полёта. Это две направляющие полосы, указывающие угол наклона и курс, к которым стремится автоматика, позволяя вам следовать им вручную без включения автопилота
      show_course_deviation:
        .: Показывать отклонение от курса
        description: Управляет тем, когда отображаются индикаторы отклонения от курса. Они показывают, насколько далеко вы отклонились от курса плана полёта, горизонтально в нижней части HUD и вертикально на его правой стороне
    misc:
      .: Разное
      show_flight_path_vector:
        .: Показывать вектор пути полёта
        description: Управляет тем, отображается ли вектор пути полёта. Это небольшой символ, отмечающий направление, в котором вы фактически движетесь по воздуху, что может отличаться от направления взгляда
      show_coordinates:
        .: Показывать координаты
        description: Управляет тем, когда ваши текущие координаты отображаются на HUD
      show_alerts:
        .: Показывать предупреждения
        description: 'Управляет тем, когда предупреждения безопасности полёта отображаются на HUD. Они также скрываются, когда §lПредупреждения безопасности полёта§r установлены на §lВключено: только звук§r или §lВыключено§r во вкладке §lОсновное§r'
      show_status_messages:
        .: Показывать статусные сообщения
        description: Управляет тем, когда отображаются статусные сообщения. Это информационные тексты в правом верхнем углу HUD, такие как текущая тяга, расстояние и время до вашей цели или текущая фаза плана полёта
  alerts:
    .: Предупреждения
    sound:
      .: Звук
      volume:
        .: Громкость звуков предупреждений
        description: Управляет тем, насколько громкими являются звуки предупреждений, в процентах от вашей общей громкости. Это множитель, применяемый поверх ползунков громкости игры, поэтому фактическая громкость никогда не может превышать общую громкость
      allow_looping:
        .: Разрешить зацикливание звуков
        description: Управляет тем, могут ли звуки предупреждений, которые повторяются до устранения опасности, зацикливаться. Выключение этого параметра воспроизводит каждый звук предупреждения только один раз
    severity:
      warning_and_danger: Предупреждение и опасность
      warning_only: Только предупреждение
      danger_only: Только опасность
      disabled: Выключено
    elytra_durability:
      .: Прочность элитр
      severity:
        .: Важность предупреждения
        description: Управляет тем, какие уровни предупреждения о прочности элитр отображаются. Предупреждение означает, что осталось менее 90 секунд полёта, а опасность означает, что осталось менее 30 секунд полёта
    stall:
      .: Сваливание (потеря подъёмной силы)
      severity:
        .: Важность предупреждения
        description: Управляет тем, какие уровни предупреждения о сваливании отображаются. Сваливание происходит, когда вы задираете нос слишком круто и теряете скорость, из-за чего элитры теряют подъёмную силу и падают. Предупреждение означает, что сваливание развивается и вам следует опустить нос, а опасность — что вы полностью свалились и падаете
    void_damage:
      .: Урон от пустоты
      severity:
        .: Важность предупреждения
        description: Управляет тем, какие уровни предупреждения об уроне от пустоты отображаются. Если вы опуститесь слишком низко под миром, вы начнёте получать урон от пустоты. Предупреждение означает, что вы приближаетесь к высоте, на которой начинается урон от пустоты, а опасность — что вы достигли её и должны немедленно набирать высоту
    ground_proximity:
      .: Система предупреждения о близости земли (GPWS)
      sink_rate:
        .: Скорость снижения
        description: Управляет тем, какие уровни предупреждения о скорости снижения отображаются. Предупреждение (СКОР. СНИЖЕНИЯ) означает, что вы снижаетесь слишком быстро, а опасность (ТЯНИ ВВЕРХ) — что вы скоро столкнётесь с землёй, если немедленно не потянете вверх
      obstacle:
        .: Земля впереди
        description: Управляет тем, какие уровни предупреждения о земле отображаются. Предупреждение (ЗЕМЛЯ ВПЕРЕДИ) означает, что на вашем пути есть возвышенность или препятствие, а опасность (ТЯНИ ВВЕРХ) — что столкновение неминуемо, если немедленно не потянуть вверх
      below_glide_slope:
        .: Ниже глиссады
        description: Управляет тем, какие уровни предупреждения о нахождении ниже глиссады отображаются. При посадке с планом полёта глиссада — это запланированная траектория снижения к точке посадки. Предупреждение означает, что вы слегка ниже неё, а опасность — что вы опустились далеко ниже неё и можете не долететь до точки посадки
      altitude_loss:
        .: Потеря высоты при взлёте/уходе на второй круг
        description: Управляет тем, отображается ли предупреждение о потере высоты. Во время взлёта или ухода на второй круг вы должны набирать высоту, и вы будете предупреждены (НЕ ПАДАЙ), если вместо этого начнёте снижаться
    fireworks:
      .: Фейерверки
      explosive:
        .: Взрывоопасные фейерверки
        description: Управляет тем, будете ли вы предупреждены, когда держите взрывоопасную ракету-фейерверк в любой из рук. Взрывоопасные ракеты взрываются в конце ускорения, что может нанести вам урон во время полёта
      response:
        .: Отклик ускорения
        description: Управляет тем, какие уровни предупреждения об отклике фейерверков отображаются. Предупреждение означает, что ускорение фейерверком отвечает медленнее, чем ожидалось, а опасность — что оно вообще не отвечает
    chunk_loading:
      .: Загрузка чанков
      severity:
        .: Важность предупреждения
        description: Управляет тем, какие уровни предупреждения о загрузке чанков отображаются. Когда мир вокруг вас загружается слишком медленно, HUD и защиты полёта не могут видеть землю впереди. Предупреждение означает, что чанки загружаются медленно, а опасность — что вокруг вас вообще нет загруженных чанков
  protections:
    .: Защиты полёта
    general:
      .: Основное
      consider_invulnerability:
        .: Выключать защиты при неуязвимости
        description: Управляет тем, выключаются ли защиты полёта, пока вы неуязвимы, например в творческом режиме.
    elytra:
      .: Элитры
      auto_open:
        .: Автоматически открывать элитры при падении
        description: Управляет тем, открываются ли элитры автоматически при падении с опасной высоты. Они не откроются, пока вы смотрите прямо вниз, чтобы вы всё ещё могли попытаться совершить точную посадку
    stall:
      .: Сваливание (потеря подъёмной силы)
      limit_pitch:
        .: Ограничивать угол наклона для предотвращения сваливания
        description: Управляет тем, ограничивается ли ваш угол наклона вверх для предотвращения сваливания. Сваливание происходит, когда вы набираете высоту слишком круто и теряете скорость, из-за чего элитры теряют подъёмную силу и падают. Вы можете настроить предупреждение о сваливании во вкладке §lПредупреждения§r
      auto_thrust:
        .: Автоматически увеличивать тягу для выхода из сваливания
        description: Управляет тем, увеличивается ли тяга автоматически во время сваливания, чтобы помочь вам восстановить скорость и выйти из него
    void_damage:
      .: Урон от пустоты
      limit_pitch:
        .: Предотвращать снижение в пустоту
        description: Управляет тем, ограничивается ли ваш угол наклона вниз во время полёта над пустотой, чтобы вы не могли опуститься до высоты, на которой начинается урон от пустоты. Вы можете настроить предупреждение об уроне от пустоты во вкладке §lПредупреждения§r
      auto_recover:
        .: Автоматически набирать высоту от пустоты
        description: Управляет тем, увеличивается ли тяга автоматически и поднимается ли ваш угол наклона, чтобы унести вас от пустоты, когда вы слишком близко подходите к высоте урона от пустоты
    ground_proximity:
      .: Система предупреждения о близости земли (GPWS)
      sink_rate:
        .: Скорость снижения
        limit_pitch:
          .: Ограничивать угол наклона при слишком быстром снижении
          description: Управляет тем, ограничивается ли ваш угол наклона вниз, когда вы снижаетесь слишком быстро, прежде чем пикирование станет невосстановимым. Вы можете настроить предупреждение о скорости снижения во вкладке §lПредупреждения§r
        limit_thrust:
          .: Ограничивать тягу при слишком быстром снижении
          description: Управляет тем, ограничивается ли тяга, когда вы снижаетесь слишком быстро
        auto_pitch:
          .: Автоматически поднимать нос при слишком быстром снижении
          description: Управляет тем, поднимается ли ваш нос автоматически для выравнивания, когда вы снижаетесь слишком быстро
      obstacle:
        .: Земля и препятствия
        limit_thrust:
          .: Ограничивать тягу при обнаружении препятствий
          description: Управляет тем, ограничивается ли тяга при обнаружении впереди возвышенности или препятствий, давая вам больше времени на реакцию
        auto_pitch:
          .: Автоматически поднимать нос для избежания препятствий
          description: Управляет тем, поднимается ли ваш нос автоматически для перелёта через возвышенность или препятствия, обнаруженные впереди. Вы можете настроить предупреждение о земле во вкладке §lПредупреждения§r
    fireworks:
      .: Фейерверки
      lock_explosive:
        .: Предотвращать использование взрывоопасных фейерверков
        description: Управляет тем, блокируются ли взрывоопасные ракеты-фейерверки от ускорения вас. Взрывоопасные ракеты взрываются при окончании ускорения, что может нанести вам урон или убить во время полёта. Вы можете включить предупреждение при удержании взрывоопасных фейерверков во вкладке §lПредупреждения§r
      lock_obstacle:
        .: Предотвращать использование фейерверков при взгляде на препятствия
        description: Управляет тем, блокируются ли ускорения фейерверками, пока вы смотрите прямо на близкое препятствие, чтобы вы случайно не ускорились в него

